    <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eres Mi Universo - Jisleidy ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background-color: #020005;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      user-select: none;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Interfaz superpuesta limpia */
    .overlay-ui {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 90%;
      max-width: 400px;
      pointer-events: auto;
    }

    .title-header {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e9d5ff 0%, #f472b6 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #a78bfa;
      text-transform: uppercase;
    }

    .btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
      transition: all 0.2s ease;
      outline: none;
    }

    .btn:active {
      transform: scale(0.94);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="title-header">
    <h1>Eres mi Universo</h1>
    <p class="subtitle">JISLEIDY ❤️</p>
  </div>

  <div class="overlay-ui">
    <button class="btn" onclick="nextContent()">
      <span>▶️ Toca aquí Princesa</span>
    </button>
  </div>

  <script>
    // --- ESCENA Y CÁMARA 3D ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020005, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- TÚNEL DE ESTRELLAS EN AVANCE ---
    const starCount = 8000;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 200;

      starColors[i * 3] = 0.8 + Math.random() * 0.2;
      starColors[i * 3 + 1] = 0.4 + Math.random() * 0.5;
      starColors[i * 3 + 2] = 1.0;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

    const starMaterial = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      blending: THREE.AdditiveBlending
    });

    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    // --- FOTOS Y FRASES 3D ---
    const myPhotoUrls = [
      "https://files.catbox.moe/1ghstq.jpg",
      "https://files.catbox.moe/kjgs47.jpg",
      "https://files.catbox.moe/4nfm8a.jpg"
    ];

    const phrases = [
      "T amo Jisleidy ❤️",
      "mi cachetona 🥰",
      "el amor de mi vida 💖",
      "t amito 🥺💕",
      "muak 💋",
      "Gracias por estar siempre a mi lado 🥺💗",
      "Cada estrella me recuerda a ti ✨",
      "Gracias por iluminar mis días 🌙",
      "Eres mi lugar favorito 🌎",
      "Tú y yo, contra el universo 🌌",
      "Te amo más de lo que las palabras dicen 💕"
    ];

    const textureLoader = new THREE.TextureLoader();
    let photoPlanes = [];
    let textPlanes = [];
    let currentStep = 0;

    // Crear canvas con texto en 3D
    function createTextTexture(text) {
      const textCanvas = document.createElement('canvas');
      textCanvas.width = 1024;
      textCanvas.height = 256;
      const ctx = textCanvas.getContext('2d');
      ctx.clearRect(0, 0, 1024, 256);
      
      ctx.font = 'Bold 48px Poppins, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 15;
      ctx.fillText(text, 512, 140);

      const texture = new THREE.CanvasTexture(textCanvas);
      return texture;
    }

    // Crear objeto 3D para cada foto + texto
    myPhotoUrls.forEach((url, index) => {
      textureLoader.load(url, (texture) => {
        // Marco de la foto en 3D
        const geometry = new THREE.PlaneGeometry(3.6, 4.8);
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide,
          transparent: true
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(0, 0.5, - (index * 25));
        scene.add(mesh);
        photoPlanes.push(mesh);

        // Texto 3D asociado
        const textTex = createTextTexture(phrases[index % phrases.length]);
        const textGeo = new THREE.PlaneGeometry(6, 1.5);
        const textMat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true });
        const textMesh = new THREE.Mesh(textGeo, textMat);
        textMesh.position.set(0, -2.5, - (index * 25));
        scene.add(textMesh);
        textPlanes.push(textMesh);
      });
    });

    // --- ANIMACIÓN Y AVANCE CONTINUO ---
    let speed = 0.08;
    let targetZ = 10;
    const audio = new Audio("https://files.catbox.moe/0pw6tv.mp3");
    audio.loop = true;
    let isPlaying = false;

    function animate() {
      requestAnimationFrame(animate);

      // Mover estrellas hacia la cámara (Efecto túnel/avance)
      const positions = starGeometry.attributes.position.array;
      for (let i = 0; i < starCount; i++) {
        positions[i * 3 + 2] += 0.25;
        if (positions[i * 3 + 2] > 20) {
          positions[i * 3 + 2] = -180;
        }
      }
      starGeometry.attributes.position.needsUpdate = true;

      // Suave avance de la cámara
      camera.position.z += (targetZ - camera.position.z) * 0.05;
      camera.rotation.z += 0.001; // Rotación lenta de la galaxia

      // Rotación suave de las fotos en 3D
      photoPlanes.forEach((plane, i) => {
        plane.rotation.y = Math.sin(Date.now() * 0.001 + i) * 0.1;
      });

      renderer.render(scene, camera);
    }
    animate();

    // Evento al pulsar el botón
    function nextContent() {
      if (!isPlaying) {
        audio.play().then(() => { isPlaying = true; }).catch(e => console.log(e));
      }

      currentStep++;
      targetZ = 10 - (currentStep * 25); // Avanzar la cámara hacia la siguiente foto

      // Si supera las fotos creadas, volver al inicio
      if (currentStep >= myPhotoUrls.length) {
        currentStep = 0;
        targetZ = 10;
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
