<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jisleidy & Matías</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* FONDO DE PANTALLA CON TU IMAGEN PIXELADA */
    body {
      font-family: 'Press Start 2P', cursive;
      background: url('fondo.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* FILTRO OSCURO SUAVE PARA RESALTAR LA TARJETA */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    /* CONTENEDOR ARCADE PRINCIPAL */
    .arcade-container {
      width: 100%;
      max-width: 380px;
      min-height: 490px;
      background-color: #fff9e6;
      border: 5px solid #ff0055;
      border-radius: 16px;
      box-shadow: 0 8px 0 #990033, 0 12px 25px rgba(0,0,0,0.5);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .screen.active { display: flex; }

    h1 {
      color: #ff0055;
      text-shadow: 2px 2px 0px #fff;
      font-size: 0.72rem;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    /* MARCO DE LA FOTO PRINCIPAL */
    .hero-photo-frame {
      width: 100%;
      max-width: 240px;
      border: 4px solid #000;
      box-shadow: 4px 4px 0 #ff0055;
      margin: 8px 0;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .hero-photo-frame img {
      width: 100%;
      height: auto;
      max-height: 210px;
      object-fit: cover;
      display: block;
    }

    /* ESTILO PARA LOS MUÑECOS PIXEL */
    .sprite-img {
      width: 140px;
      height: auto;
      max-height: 150px;
      object-fit: contain;
      image-rendering: pixelated;
      margin: 10px 0;
      mix-blend-mode: multiply;
    }

    /* GALERÍA DESLIZABLE DE FOTOS */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      width: 100%;
      max-height: 280px;
      overflow-y: auto;
    }

    .photo-card {
      background: #fff;
      border: 3px solid #000;
      padding: 5px;
      box-shadow: 3px 3px 0 #ff9900;
      width: 90%;
    }

    .photo-card img {
      width: 100%;
      max-height: 190px;
      object-fit: cover;
      display: block;
      border: 1px solid #000;
    }

    /* CAJA DE TEXTO RETRO */
    .text-box {
      background-color: #ffffff;
      border: 4px solid #000;
      padding: 12px;
      box-shadow: 4px 4px 0 #74b9ff;
      font-size: 0.58rem;
      line-height: 1.8;
      color: #222;
      width: 100%;
      margin: 10px 0;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      align-items: center;
    }

    /* BOTONES ESTILO ARCADE */
    .arcade-btn {
      background-color: #ffcc00;
      color: #000;
      border: 3px solid #000;
      padding: 12px 15px;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.62rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #c79e00;
      width: 90%;
    }

    .arcade-btn:active {
      box-shadow: 0 0 0 #c79e00;
      transform: translateY(4px);
    }

    .arcade-btn.btn-no {
      background-color: #ff7675;
      color: #fff;
      box-shadow: 0 4px 0 #d63031;
    }
  </style>
</head>
<body>

  <div class="arcade-container">

    <!-- PANTALLA 1: INICIO -->
    <div id="screen1" class="screen active">
      <h1>¿Quieres seguir viendo todo lo que siento por ti? ❤️</h1>
      
      <div class="hero-photo-frame">
        <img src="Screenshot_20260829-foto4.png" alt="Nosotros">
      </div>

      <div class="btn-group">
        <button class="arcade-btn" onclick="goToScreen(3)">Sí, sí, sí quiero</button>
        <button class="arcade-btn btn-no" onclick="goToScreen(2)">No, no quiero</button>
      </div>
    </div>

    <!-- PANTALLA 2: OPCIÓN BLOQUEADA -->
    <div id="screen2" class="screen">
      <h1>Por favor, dale que sí 🥺❤️</h1>
      <div class="text-box">
        <p>¡Esa opción está bloqueada!</p>
      </div>
      <button class="arcade-btn" onclick="goToScreen(1)">Está bien</button>
    </div>

    <!-- PANTALLA 3: GALERÍA DE FOTOS -->
    <div id="screen3" class="screen">
      <h1>NUESTROS MOMENTOS ✨</h1>

      <div class="gallery">
        <div class="photo-card"><img src="Screenshot_20260829-foto4.png" alt="Foto Juntos"></div>
        <div class="photo-card"><img src="IMG-20260828-foto1.jpg" alt="Foto 1"></div>
        <div class="photo-card"><img src="IMG-20260827-foto2.jpg" alt="Foto 2"></div>
        <div class="photo-card"><img src="motion_photo_foto3.jpg" alt="Foto 3"></div>
      </div>

      <button class="arcade-btn" style="margin-top: 10px;" onclick="goToScreen(4)">Ver carta final ➔</button>
    </div>

    <!-- PANTALLA 4: FINAL CON MUÑECOS PIXEL -->
    <div id="screen4" class="screen">
      <h1>LEVEL CLEAR! 🏆</h1>
      
      <img class="sprite-img" src="sprite.png" alt="Muñecos Pixel">

      <div class="text-box">
        <p>Eres la persona más increíble de todas. Gracias por compartir cada momento a mi lado. ¡Te amo muchísimo, Jisleidy! ❤️✨</p>
      </div>

      <button class="arcade-btn" onclick="goToScreen(1)">🔄 REINICIAR</button>
    </div>

  </div>

  <script>
    function goToScreen(screenNumber) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById('screen' + screenNumber).classList.add('active');
    }
  </script>
</body>
</html>
