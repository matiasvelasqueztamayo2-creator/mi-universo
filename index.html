<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eres Mi Universo - Jisleidy ✨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #020005; font-family: 'Poppins', sans-serif; color: #fff; user-select: none; }
    #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .title-header {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e9d5ff 0%, #f472b6 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
    }

    p.subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #a78bfa;
      text-transform: uppercase;
    }

    .overlay-ui {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: auto;
    }

    .btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
      transition: all 0.2s ease;
      outline: none;
    }

    .btn:active { transform: scale(0.94); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="title-header">
    <h1>Eres mi Universo</h1>
    <p class="subtitle">JISLEIDY ❤️</p>
  </div>

  <div class="overlay-ui">
    <button class="btn" onclick="nextContent()">
      <span>▶️ Toca aquí Princesa</span>
    </button>
  </div>

  <div style="display:none;">
    <img id="img0" src="https://files.catbox.moe/1ghstq.jpg" crossorigin="anonymous">
    <img id="img1" src="https://files.catbox.moe/kjgs47.jpg" crossorigin="anonymous">
    <img id="img2" src="https://files.catbox.moe/4nfm8a.jpg" crossorigin="anonymous">
  </div>

  <script>
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020005, 0.01);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // GRUPO GLOBAL: Estrellas + Fotos + Texto avanzan juntos
    const universeGroup = new THREE.Group();
    scene.add(universeGroup);

    // --- TÚNEL DE ESTRELLAS ---
    const starCount = 6000;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 300;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ size: 0.22, color: 0xe0aaff, transparent: true });
    const starField = new THREE.Points(starGeometry, starMaterial);
    universeGroup.add(starField);

    // --- CONTENIDO 3D (FOTO + FRASE UNIDAS) ---
    const items = [
      { imgId: "img0", text: "T amo Jisleidy ❤️" },
      { imgId: "img1", text: "Mi cachetona 🥰" },
      { imgId: "img2", text: "El amor de mi vida 💖" },
      { imgId: "img0", text: "Gracias por estar siempre 🥺💗" },
      { imgId: "img1", text: "Cada estrella me recuerda a ti ✨" },
      { imgId: "img2", text: "Eres mi lugar favorito 🌎" }
    ];

    const cardsList = [];

    function generateTexture(imgElement, phrase) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 700;
      const ctx = c.getContext('2d');

      // Marco
      ctx.fillStyle = "rgba(18, 10, 32, 0.9)";
      ctx.fillRect(0, 0, 512, 700);
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#f472b6";
      ctx.strokeRect(5, 5, 502, 690);

      // Dibujar imagen
      try {
        ctx.drawImage(imgElement, 30, 30, 452, 500);
      } catch (e) {
        ctx.fillStyle = "#8b5cf6";
        ctx.fillRect(30, 30, 452, 500);
      }

      // Texto
      ctx.font = "Bold 32px Poppins, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.shadowColor = "#f472b6";
      ctx.shadowBlur = 12;
      ctx.fillText(phrase, 256, 615);

      return new THREE.CanvasTexture(c);
    }

    // Esperar carga de imágenes y construir objetos
    window.addEventListener('load', () => {
      items.forEach((item, index) => {
        const imgEl = document.getElementById(item.imgId);
        const texture = generateTexture(imgEl, item.text);

        const geo = new THREE.PlaneGeometry(4, 5.5);
        const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        const cardMesh = new THREE.Mesh(geo, mat);

        // Posicionar a lo largo del túnel
        cardMesh.position.set(0, 0, - (index * 30));
        universeGroup.add(cardMesh);
        cardsList.push(cardMesh);
      });
    });

    // --- ANIMACIÓN ---
    let targetZ = 0;
    let currentStep = 0;
    const audio = new Audio("https://files.catbox.moe/0pw6tv.mp3");
    audio.loop = true;
    let isPlaying = false;

    function animate() {
      requestAnimationFrame(animate);

      // Hace que todo el universo (estrellas + imágenes + frases) se desplace hacia adelante
      universeGroup.position.z += (targetZ - universeGroup.position.z) * 0.05;

      // Rotación suave individual de cada marco en 3D
      cardsList.forEach((card, i) => {
        card.rotation.y = Math.sin(Date.now() * 0.0015 + i) * 0.1;
      });

      renderer.render(scene, camera);
    }
    animate();

    function nextContent() {
      if (!isPlaying) {
        audio.play().then(() => { isPlaying = true; }).catch(e => console.log(e));
      }

      currentStep++;
      if (currentStep >= items.length) {
        currentStep = 0;
      }
      // Avance hacia el siguiente objeto en 3D
      targetZ = currentStep * 30;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
