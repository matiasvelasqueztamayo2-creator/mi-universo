<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eres Mi Universo - Jisleidy ✨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background-color: #020005; font-family: 'Poppins', sans-serif; color: #fff; user-select: none; }
    #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .title-header {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e9d5ff 0%, #f472b6 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.4);
    }

    p.subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #a78bfa;
      text-transform: uppercase;
    }

    .card-container {
      position: fixed;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: 85%;
      max-width: 340px;
      background: rgba(18, 10, 32, 0.9);
      border: 3px solid #f472b6;
      border-radius: 22px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
      pointer-events: none;
    }

    .photo-wrapper {
      width: 100%;
      height: 270px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #110826;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .photo-wrapper img.fade, .phrase-text.fade {
      opacity: 0;
    }

    .phrase-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
      transition: opacity 0.3s ease;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-ui {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: auto;
    }

    .btn {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
      transition: all 0.2s ease;
      outline: none;
    }

    .btn:active { transform: scale(0.94); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="title-header">
    <h1>Eres mi Universo</h1>
    <p class="subtitle">JISLEIDY ❤️</p>
  </div>

  <div class="card-container">
    <div class="photo-wrapper">
      <img id="mainPhoto" src="IMG-20260828-foto1.jpg" alt="Foto Jisleidy">
    </div>
    <div id="mainPhrase" class="phrase-text">✨ Toca para comenzar Princesa ✨</div>
  </div>

  <div class="overlay-ui">
    <button class="btn" onclick="nextContent()">
      <span>▶️ Toca aquí Princesa</span>
    </button>
  </div>

  <script>
    // --- ESTRELLAS EN AVANCE CONTINUO ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020005, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const starCount = 7000;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 300;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ size: 0.22, color: 0xe0aaff, transparent: true });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    function animate() {
      requestAnimationFrame(animate);

      const positions = starGeometry.attributes.position.array;
      for (let i = 0; i < starCount; i++) {
        positions[i * 3 + 2] += 0.4;
        if (positions[i * 3 + 2] > 20) {
          positions[i * 3 + 2] = -280;
        }
      }
      starGeometry.attributes.position.needsUpdate = true;
      starField.rotation.z += 0.0008;

      renderer.render(scene, camera);
    }
    animate();

    // --- FOTOS REALES Y FRASES ---
    const items = [
      { url: "IMG-20260828-foto1.jpg", text: "T amo Jisleidy ❤️" },
      { url: "IMG-20260827-foto2.jpg", text: "Mi cachetona 🥰" },
      { url: "motion_photo_foto3.jpg", text: "El amor de mi vida 💖" },
      { url: "IMG-20260828-foto1.jpg", text: "Gracias por estar siempre 🥺💗" },
      { url: "IMG-20260827-foto2.jpg", text: "Cada estrella me recuerda a ti ✨" },
      { url: "motion_photo_foto3.jpg", text: "Eres mi lugar favorito 🌎" }
    ];

    let currentIndex = 0;
    const audio = new Audio("https://files.catbox.moe/0pw6tv.mp3");
    audio.loop = true;
    let isPlaying = false;

    function nextContent() {
      const imgEl = document.getElementById('mainPhoto');
      const textEl = document.getElementById('mainPhrase');

      if (!isPlaying) {
        audio.play().then(() => { isPlaying = true; }).catch(e => console.log(e));
      }

      imgEl.classList.add('fade');
      textEl.classList.add('fade');

      setTimeout(() => {
        const item = items[currentIndex % items.length];
        imgEl.src = item.url;
        textEl.innerText = item.text;

        imgEl.classList.remove('fade');
        textEl.classList.remove('fade');

        currentIndex++;
      }, 300);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
